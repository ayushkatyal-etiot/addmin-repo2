name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    env:
      # Dummy DATABASE_URL for prisma generate schema validation (no actual DB needed)
      DATABASE_URL: postgresql://user:password@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v4

      # Version is intentionally omitted here: pnpm/action-setup reads it
      # from the "packageManager" field in package.json. Setting an explicit
      # `version` input here as well causes ERR_PNPM_BAD_PM_VERSION when the
      # two disagree, so package.json's packageManager is the single source
      # of truth for the pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @addmin/db run generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
