baseURL = "https://addmin.example.com"
title = "AddMin — Office Administration OS"
theme = "hugo-saasify-theme"

enableEmoji = true

[taxonomies]
  category = 'categories'
  tag = 'tags'

[pagination]
  pagerSize = 6
  path = "page"

# =============================================================================
# Site Parameters
# =============================================================================
[params]
  description = "AddMin is the office administration operating system that tells admin teams what to manage — utilities, leases, compliance, vendors, assets, maintenance — before anything gets missed."
  author = "AddMin"
  logo = "/images/logo.png"

  [params.social]
    linkedin = "https://linkedin.com/company/addmin"

  [params.footer]
    column_1_title = "PRODUCT"
    column_2_title = "COMPANY"
    column_3_title = "LEGAL"

  [params.header]
    background = "bg-white/80 backdrop-blur-sm"
    border = "border-b border-gray-100"

    [params.header.logo]
      src = "/images/logo.png"
      class = "h-12 w-auto"

    [params.header.menu]
      spacing = "space-x-8"

      [params.header.menu.dropdown]
        width = "w-72"
        container_padding = "py-6"
        item_padding = "px-8 py-3"
        background = "bg-white"
        border = "border border-gray-100"
        shadow = "shadow-xl"
        radius = "rounded-lg"
        text_color = "text-gray-700"
        hover_background = "hover:bg-gray-50"
        text_size = "text-sm"

    [params.header.buttons]
      [params.header.buttons.signIn]
        text = "Sign in"
        url = "http://localhost:3000/login"
      [params.header.buttons.getStarted]
        text = "Start Free Trial"
        url = "http://localhost:3000/signup"

  [params.blog]
    enable = false

  [params.cta]
    enable = true
    title = "Stop finding out a bill is late after the vendor calls to disconnect you."
    description = "See how AddMin turns utilities, leases, AMCs and compliance into one obligation calendar your team never has to remember on its own."
    gradient_from = "#00713b"
    gradient_to = "#008D49"
    gradient_angle = 30

    [params.cta.primary_button]
      text = "Start Free Trial"
      url = "http://localhost:3000/signup"
    [params.cta.secondary_button]
      text = "See Pricing"
      url = "/pricing"

# =============================================================================
# Navigation Menus
# =============================================================================
[[menu.main]]
  name = "Features"
  weight = 1
  [menu.main.params]
    has_submenu = true
    submenu = [
      { name = "Obligation Engine", url = "/features/obligation-engine/" },
      { name = "Approvals & Payments", url = "/features/approvals-payments/" },
      { name = "Executive Dashboard", url = "/features/executive-dashboard/" }
    ]

[[menu.main]]
  name = "Pricing"
  url = "/pricing"
  weight = 2

[[menu.main]]
  name = "Company"
  url = "/company"
  weight = 3

# Footer Column 1 (Product)
[[menu.footer_column_1]]
  name = "Obligation Engine"
  url = "/features/obligation-engine/"
  weight = 1
[[menu.footer_column_1]]
  name = "Approvals & Payments"
  url = "/features/approvals-payments/"
  weight = 2
[[menu.footer_column_1]]
  name = "Executive Dashboard"
  url = "/features/executive-dashboard/"
  weight = 3
[[menu.footer_column_1]]
  name = "Pricing"
  url = "/pricing"
  weight = 4

# Footer Column 2 (Company)
[[menu.footer_column_2]]
  name = "About Us"
  url = "/company"
  weight = 1
[[menu.footer_column_2]]
  name = "Contact"
  url = "/contact"
  weight = 2

# Footer Column 3 (Legal)
[[menu.footer_column_3]]
  name = "Privacy Policy"
  url = "/privacy"
  weight = 1
[[menu.footer_column_3]]
  name = "Terms of Service"
  url = "/terms"
  weight = 2

# =============================================================================
# Build & Technical Settings (REQUIRED -- do not remove)
# =============================================================================
[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

[build]
  writeStats = true

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
